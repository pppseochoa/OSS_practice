name: Deploy to Windows local Docker

on:
  workflow_run:
    workflows: ["Build, verify and publish Docker image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Do not cancel a running container replacement or rollback.
concurrency:
  group: kbo-salary-local-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        # Apply to the Runner-generated outer script too, not only deploy-local.ps1.
        # This affects only this child process, never the machine/user policy.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Initialize UTF-8 observation artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP "kbo-observation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          "REPORT_DIR=$directory" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'Monitoring not started yet; intervals outside collected requests are UNVERIFIED.' | Out-File (Join-Path $directory 'status.txt') -Encoding utf8

      - name: Check that successful CI still represents main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          API_URL: ${{ github.api_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'kbo-salary-deploy' }
          $branch = [uri]::EscapeDataString($env:DEFAULT_BRANCH)
          $head = Invoke-RestMethod -Uri "$env:API_URL/repos/$env:REPOSITORY/commits/$branch" -Headers $headers
          $current = ($head.sha -eq $env:DEPLOY_SHA)
          "current=$($current.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $current) { Write-Host 'Skipping superseded CI revision.' }

      - name: Check out exactly the successfully built revision
        if: steps.revision.outputs.current == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify Windows Runner can use Linux Docker
        if: steps.revision.outputs.current == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $os = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $os.Trim() -ne 'linux') {
            throw 'Start Docker Desktop in Linux containers mode under the Runner account, then retry this workflow.'
          }
          # Preserve Desktop's endpoint when isolating DOCKER_CONFIG below.
          if ([string]::IsNullOrWhiteSpace($env:DOCKER_HOST)) {
            $endpoint = docker context inspect --format '{{.Endpoints.docker.Host}}'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot determine Docker Desktop endpoint.' }
            "DOCKER_HOST=$($endpoint.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          # Isolate registry credentials from the Runner user's normal Docker config.
          $config = Join-Path $env:RUNNER_TEMP "kbo-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          "DOCKER_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Log in to Docker Hub
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Monitor independently, deploy and observe 30 seconds
        if: steps.revision.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) { throw 'Missing DOCKERHUB_USERNAME secret.' }
          $image = "$($env:DOCKERHUB_USERNAME.ToLowerInvariant())/kbo-salary:sha-$env:DEPLOY_SHA"
          # Independent Python process, but retain its owning Windows console until
          # deployment AND post-deploy observation complete. No cross-step child.
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/observe-deployment.ps1 -ImageRef $image -DeploymentVersion $env:DEPLOY_SHA -Directory "$env:REPORT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Deployment or observation failed.' }

      - name: Finish monitoring (30 seconds after deploy, even on failure)
        if: always() && steps.revision.outputs.current == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType File -Path (Join-Path $env:REPORT_DIR 'stop.request') -Force | Out-Null
          if (Test-Path (Join-Path $env:REPORT_DIR 'monitor.pid')) {
            $monitorId = [int](Get-Content (Join-Path $env:REPORT_DIR 'monitor.pid'))
            for ($i=0; $i -lt 140; $i++) {
              if ((Test-Path (Join-Path $env:REPORT_DIR 'done')) -or -not (Get-Process -Id $monitorId -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Milliseconds 500
            }
            if (Get-Process -Id $monitorId -ErrorAction SilentlyContinue) { Stop-Process -Id $monitorId; 'Monitor stopped after timeout; remaining interval UNVERIFIED.' | Out-File (Join-Path $env:REPORT_DIR 'timeout.txt') -Encoding utf8 }
          }
          if (Test-Path ./scripts/monitor_summary.py) {
            python ./scripts/monitor_summary.py "$env:REPORT_DIR"
            Get-Content (Join-Path $env:REPORT_DIR 'summary.md') -Raw -Encoding utf8 | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            python ./scripts/capture_report.py "$env:REPORT_DIR"
          }
          if (Test-Path (Join-Path $env:REPORT_DIR 'monitor.stdout.log')) { Get-Content (Join-Path $env:REPORT_DIR 'monitor.stdout.log') -Encoding utf8 }
          if (Test-Path (Join-Path $env:REPORT_DIR 'monitor.stderr.log')) { Get-Content (Join-Path $env:REPORT_DIR 'monitor.stderr.log') -Encoding utf8 }

      - name: Upload full UTF-8 logs and one-screen report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      # docker/login-action logs out in its post step. RUNNER_TEMP is outside Git.
